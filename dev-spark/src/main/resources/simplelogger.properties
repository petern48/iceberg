# SLF4J SimpleLogger configuration
# Set all logging to ERROR level to suppress verbose Spark output
org.slf4j.simpleLogger.defaultLogLevel=error
org.slf4j.simpleLogger.log.org.apache.spark=error
org.slf4j.simpleLogger.log.org.apache.hadoop=error
org.slf4j.simpleLogger.log.org.apache.iceberg=error
org.slf4j.simpleLogger.log.org.sparkproject=error
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=false
